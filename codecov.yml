# Codecov 覆盖率门禁配置
# project：整体覆盖率门槛（Codecov 口径 = 分支全走的行才计覆盖）。-fno-exceptions
#   消除 gcov 幻影异常边后实测 96.3%（2026-08-06），阈值 70% 余量 26 点
#   （bf_rpc 的 navdata SKIP 区 + flightplan_json_module 桩文件不计）。
# patch：PR 新增代码行覆盖率门槛（与 TDD 纪律对齐，新代码必须有测试）
# 排除项由 workflow 中的 gcovr --exclude 负责（third_party 依赖与测试自身代码不计入）
coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%
