name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
        config: [debug, release, tsan]
        exclude:
          # MSVC does not support -fsanitize; replace with Windows-specific
          # configs below.
          - os: windows-latest
            config: debug
          - os: windows-latest
            config: release
          - os: windows-latest
            config: tsan
        include:
          - os: windows-latest
            config: windows-debug
          - os: windows-latest
            config: windows-release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: true

      # -- ccache (Linux & macOS only) --------------------------------------
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ccache

      - name: Cache ccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.config }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.config }}-${{ github.ref }}-
            ccache-linux-${{ matrix.config }}-

      - name: Cache ccache (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.config }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.config }}-${{ github.ref }}-
            ccache-macos-${{ matrix.config }}-

      # -- Configure --------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          args=(-B "build/${{ matrix.config }}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPX_BUILD_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5)

          case "${{ matrix.config }}" in
            debug)
              args+=(-DCMAKE_BUILD_TYPE=Debug)
              args+=(-DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer")
              args+=(-DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined")
              ;;
            release)
              args+=(-DCMAKE_BUILD_TYPE=Release)
              args+=(-DCMAKE_CXX_FLAGS="-O2 -Wall -Wextra")
              ;;
            tsan)
              args+=(-DCMAKE_BUILD_TYPE=RelWithDebInfo)
              args+=(-DCMAKE_CXX_FLAGS="-O1 -g -Wall -Wextra -fsanitize=thread -fno-omit-frame-pointer")
              args+=(-DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread")
              ;;
            windows-debug)
              args+=(-DCMAKE_BUILD_TYPE=Debug)
              ;;
            windows-release)
              args+=(-DCMAKE_BUILD_TYPE=Release)
              ;;
          esac

          if [[ "${{ runner.os }}" != "Windows" ]]; then
            args+=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            args+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache)
          fi

          cmake "${args[@]}"

      # -- Build ------------------------------------------------------------
      - name: Build
        shell: bash
        run: cmake --build build/${{ matrix.config }} -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      # -- Test -------------------------------------------------------------
      - name: Test
        shell: bash
        run: |
          # Windows 上 ctest 中文测试名需 UTF-8 代码页（catch_discover_tests 编码问题）
          if [[ "$RUNNER_OS" == "Windows" ]]; then chcp.com 65001 > /dev/null; fi
          ctest --test-dir build/${{ matrix.config }} -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4) --timeout 300 --output-on-failure

  # -- Format check (clang-format-18, 只检查不修改) ---------------------------
  format-check:
    runs-on: ubuntu-24.04

    steps:
      # 不需要 submodule——检查范围排除 lib/bravofinder（独立仓库，自带本地 hook）
      - uses: actions/checkout@v7.0.0

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-18

      - name: Check formatting
        shell: bash
        run: |
          find include lib service src tests \( -name '*.h' -o -name '*.cc' \) \
            ! -path 'lib/bravofinder/*' -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  # -- Code coverage (Codecov 上传, OIDC 免 token) ----------------------------
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Codecov OIDC 身份交换所需

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: true

      # -- Configure --------------------------------------------------------
      - name: Configure
        shell: bash
        run: >
          cmake -B build/coverage -DCMAKE_BUILD_TYPE=Debug -DPX_BUILD_TESTS=ON
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_CXX_FLAGS="--coverage"
          -DCMAKE_C_FLAGS="--coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      # -- Build ------------------------------------------------------------
      - name: Build
        shell: bash
        run: cmake --build build/coverage -j $(nproc 2>/dev/null || echo 4)

      # -- Test -------------------------------------------------------------
      - name: Test
        shell: bash
        run: ctest --test-dir build/coverage -j $(nproc 2>/dev/null || echo 4) --timeout 300 --output-on-failure

      # -- Report (gcovr 生成 XML; 仅统计 px 自有代码) ---------------------------
      # 搜索目录显式枚举 lib/service/tests/cpp：_deps 的依赖库也被 --coverage 编译，
      # 其相对源码路径无法解析会直接报错，故不进入扫描；
      # bf 子模块引擎与测试自身代码经 --exclude 从报告剔除（bf 覆盖归 bravofinder 自己）
      - name: Generate coverage report
        shell: bash
        run: |
          sudo apt-get install -y gcovr
          gcovr build/coverage/lib build/coverage/service build/coverage/tests/cpp \
            --root . \
            --exclude '.*/bravofinder/.*' \
            --exclude '.*/tests/.*' \
            --xml-pretty --output build/coverage/coverage.xml

      # -- Upload (OIDC: GitHub App 已安装, 无 CODECOV_TOKEN) ------------------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          use_oidc: true
          files: build/coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: true
